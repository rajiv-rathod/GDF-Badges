# nginx reverse proxy for GDF CertView.
# Install:  sudo cp deploy/nginx-certview.conf /etc/nginx/sites-available/certview
#           sudo ln -s /etc/nginx/sites-available/certview /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then:     sudo certbot --nginx -d certview.gdf.social   (adds the 443 block + auto-renew)
server {
    listen 80;
    listen [::]:80;
    server_name certview.gdf.social;

    # Certificate PDFs / image uploads can be a few MB.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
