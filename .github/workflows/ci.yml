name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Credential integrity + render tests
        run: npm test
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Build web app
        run: npm run build:web
